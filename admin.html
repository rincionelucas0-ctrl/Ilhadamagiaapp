<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#102a2a" />
  <title>Admin | Ilha da Magia</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#f3f6f4;--panel:#fff;--ink:#172b2a;--muted:#6b7d79;--line:#e3eae6;--brand:#145b50;--brand2:#d8eee6;--danger:#a43c36;--shadow:0 12px 35px rgba(19,48,41,.08)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top right,#d8eee6,transparent 42%),var(--bg)}
    .login-card{width:min(100%,430px);background:var(--panel);padding:34px;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
    .brand-mark{width:48px;height:48px;border-radius:15px;background:var(--brand);color:white;display:grid;place-items:center;font-weight:800;font-size:20px;margin-bottom:20px}
    h1,h2,h3,p{margin-top:0}h1{font-size:25px;line-height:1.2;margin-bottom:8px}h2{font-size:22px;margin-bottom:6px}h3{font-size:16px}
    .muted{color:var(--muted)}.field{display:grid;gap:7px;margin:18px 0}.field label{font-size:13px;font-weight:650}.field input{width:100%;padding:12px 13px;border:1px solid #ccd8d2;border-radius:11px;background:#fff;outline:none}.field input:focus{border-color:var(--brand);box-shadow:0 0 0 3px #145b5018}
    .btn{border:0;border-radius:11px;padding:11px 16px;font-weight:700}.btn-primary{background:var(--brand);color:#fff}.btn-primary:hover{background:#0d483f}.btn-quiet{background:#edf3f0;color:var(--ink)}.btn-danger{background:#fff0ee;color:var(--danger)}
    .full{width:100%}.message{margin-top:14px;padding:11px 12px;border-radius:10px;background:#f2f5f3;color:var(--muted);font-size:13px}.message.error{background:#fff0ee;color:var(--danger)}
    .app{min-height:100vh;display:grid;grid-template-columns:260px minmax(0,1fr)}.sidebar{background:#102a2a;color:#e9f4ef;padding:22px 15px;display:flex;flex-direction:column;gap:24px}.side-brand{display:flex;align-items:center;gap:11px;padding:0 8px}.side-brand .brand-mark{margin:0;width:40px;height:40px;border-radius:12px;background:#24685c}.side-brand strong{display:block}.side-brand small{color:#a8c3b8}
    nav{display:grid;gap:5px}.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#89a99d;padding:0 11px;margin:5px 0}.nav-btn{display:flex;align-items:center;gap:11px;width:100%;border:0;text-align:left;padding:10px 11px;border-radius:10px;color:#c6d8d1;background:transparent;font-size:13px}.nav-btn:hover,.nav-btn.active{background:#214641;color:#fff}.nav-icon{width:20px;text-align:center;opacity:.9}.side-bottom{margin-top:auto;border-top:1px solid #31504a;padding:16px 8px 0}.admin-info{font-size:12px;color:#a8c3b8;overflow-wrap:anywhere;margin-bottom:12px}
    main{min-width:0;padding:28px clamp(18px,3vw,42px)}.topbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:28px}.eyebrow{font-size:12px;color:var(--brand);font-weight:750;text-transform:uppercase;letter-spacing:.08em}.page-title{margin:3px 0 0}.content-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 3px 14px rgba(19,48,41,.025)}.span-12{grid-column:span 12}.span-6{grid-column:span 6}.span-4{grid-column:span 4}.stat{font-size:28px;font-weight:800;margin:10px 0 2px}.stat-label{font-size:13px;color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.section-head h3{margin:0}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}td.empty{text-align:center;color:var(--muted);padding:26px}.pill{display:inline-flex;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#edf3f0;color:#42645a}.pill.ok{background:#e4f4e9;color:#28613c}.pill.warn{background:#fff3db;color:#8a5b0a}.pill.bad{background:#fff0ee;color:#a43c36}.notice{padding:14px;border-radius:12px;background:#f0f6f3;color:#45635a;font-size:13px}.mobile-menu{display:none}
    @media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:sticky;top:0;z-index:5;padding:12px 14px;gap:10px}.side-brand{padding:0}.sidebar nav{display:flex;overflow:auto;gap:5px}.nav-label{display:none}.nav-btn{width:auto;white-space:nowrap;padding:9px 11px}.side-bottom{display:none}main{padding:22px 16px}.span-4{grid-column:span 6}}
    @media(max-width:560px){.login-card{padding:25px}.topbar{align-items:flex-start}.span-6,.span-4{grid-column:span 12}.topbar .btn{padding:9px 11px;font-size:12px}}
  </style>
</head>
<body>
  <section id="loginView" class="login-wrap">
    <div class="login-card">
      <div class="brand-mark">I</div>
      <div class="eyebrow">Ilha da Magia</div>
      <h1>Panel administrativo</h1>
      <p class="muted">Ingresá con una cuenta de administrador autorizada.</p>
      <form id="loginForm">
        <div class="field"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="username" required /></div>
        <div class="field"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required /></div>
        <button class="btn btn-primary full" type="submit" id="loginBtn">Ingresar</button>
      </form>
      <div id="loginMessage" class="message hidden" role="status"></div>
      <p class="muted" style="font-size:12px;margin:18px 0 0">El acceso requiere una sesión válida y un registro activo en la tabla <code>public.admins</code>.</p>
    </div>
  </section>

  <div id="appView" class="app hidden">
    <aside class="sidebar">
      <div class="side-brand"><div class="brand-mark">I</div><div><strong>Ilha da Magia</strong><small>Administración</small></div></div>
      <nav id="navigation" aria-label="Navegación administrativa">
        <div class="nav-label">General</div>
        <button class="nav-btn active" data-page="dashboard"><span class="nav-icon">⌂</span>Dashboard</button>
        <div class="nav-label">Contenido</div>
        <button class="nav-btn" data-page="natural_places"><span class="nav-icon">⌖</span>Lugares naturales</button>
        <button class="nav-btn" data-page="businesses"><span class="nav-icon">▦</span>Negocios</button>
        <button class="nav-btn" data-page="events"><span class="nav-icon">▣</span>Eventos</button>
        <button class="nav-btn" data-page="tours"><span class="nav-icon">⌁</span>Tours</button>
        <button class="nav-btn" data-page="missions"><span class="nav-icon">◇</span>Misiones</button>
        <button class="nav-btn" data-page="community"><span class="nav-icon">◎</span>Comunidad</button>
        <div class="nav-label">Gestión</div>
        <button class="nav-btn" data-page="proposals"><span class="nav-icon">＋</span>Propuestas</button>
        <button class="nav-btn" data-page="reports"><span class="nav-icon">⚑</span>Reportes</button>
        <button class="nav-btn" data-page="users"><span class="nav-icon">♙</span>Usuarios</button>
        <button class="nav-btn" data-page="billing"><span class="nav-icon">＄</span>Suscripciones y pagos</button>
        <button class="nav-btn" data-page="notifications"><span class="nav-icon">♧</span>Notificaciones</button>
        <button class="nav-btn" data-page="activity"><span class="nav-icon">◷</span>Registro de actividad</button>
        <button class="nav-btn hidden" id="settingsNav" data-page="settings"><span class="nav-icon">⚙</span>Configuraciones críticas</button>
      </nav>
      <div class="side-bottom"><div id="adminIdentity" class="admin-info"></div><button id="logoutBtn" class="btn btn-quiet full">Cerrar sesión</button></div>
    </aside>
    <main>
      <header class="topbar">
        <div><div class="eyebrow">Administración</div><h2 id="pageTitle" class="page-title">Dashboard</h2></div>
        <button id="mobileLogout" class="btn btn-quiet" style="display:none">Salir</button>
      </header>
      <div id="pageContent" class="content-grid"></div>
    </main>
  </div>
  <script>
    // Configuración pública del cliente. Reemplazá la clave por la publishable key del proyecto.
    const SUPABASE_URL = "https://omgtueqcfyznkibygfow.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_a1inelFo5ZozPKea_GqRug_WvTRYNfr";
    const clientReady = window.supabase && SUPABASE_PUBLISHABLE_KEY.startsWith("sb_publishable_");
    const db = clientReady ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY) : null;

    const $ = (id) => document.getElementById(id);
    const pages = {
      dashboard:{title:"Dashboard",table:null,description:"Resumen general y accesos rápidos del panel."},
      natural_places:{title:"Lugares naturales",table:"natural_places",description:"Administrá lugares, información de visita y publicación."},
      businesses:{title:"Negocios",table:"businesses",description:"Revisá negocios, estado y propuestas comerciales."},
      events:{title:"Eventos",table:"events",description:"Administrá eventos y sus ocurrencias."},
      tours:{title:"Tours",table:"tours",description:"Gestioná experiencias, horarios, condiciones y reservas."},
      missions:{title:"Misiones",table:"missions",description:"Administrá misiones naturales y comerciales."},
      community:{title:"Comunidad",table:"community_posts",description:"Revisá publicaciones de la comunidad y moderá según corresponda."},
      proposals:{title:"Propuestas",table:"proposals",description:"Evaluá propuestas antes de convertirlas en contenido oficial."},
      reports:{title:"Reportes",table:"reports",description:"Revisá reportes. Un reporte no elimina contenido automáticamente."},
      users:{title:"Usuarios",table:"users",description:"Consultá perfiles y estado de usuarios."},
      billing:{title:"Suscripciones y pagos",table:"payments",description:"Consultá registros de pagos y suscripciones."},
      notifications:{title:"Notificaciones",table:"notifications",description:"Consultá notificaciones registradas."},
      activity:{title:"Registro de actividad",table:"admin_activity_log",description:"Trazabilidad de acciones administrativas."},
      settings:{title:"Configuraciones críticas",table:null,description:"Área reservada exclusivamente al superadministrador."}
    };
    let currentAdmin = null;

    function showMessage(text, error=false){
      const el=$("loginMessage"); el.textContent=text; el.classList.remove("hidden","error"); if(error) el.classList.add("error");
    }
    function showLogin(message=""){
      $("appView").classList.add("hidden"); $("loginView").classList.remove("hidden");
      if(message) showMessage(message,true);
    }
    function showApp(){
      $("loginView").classList.add("hidden"); $("appView").classList.remove("hidden");
      $("adminIdentity").textContent = `${currentAdmin.role === "super_admin" ? "Superadministrador" : "Administrador"} · ${currentAdmin.email || ""}`;
      $("settingsNav").classList.toggle("hidden",currentAdmin.role!=="super_admin");
      renderPage("dashboard");
    }
    async function validateAdmin(session){
      if(!session?.user){currentAdmin=null;showLogin();return false;}
      const {data,error}=await db.from("admins").select("id, auth_user_id, role, status").eq("auth_user_id",session.user.id).maybeSingle();
      if(error){showLogin("No se pudo validar el acceso administrativo. Verificá las políticas y la conexión.");return false;}
      if(!data || data.status!=="active" || !["admin","super_admin"].includes(data.role)){
        await db.auth.signOut();
        showLogin("Esta cuenta no tiene permisos administrativos activos.");
        return false;
      }
      currentAdmin={...data,email:session.user.email};
      showApp(); return true;
    }
    async function renderPage(pageKey){
      const page=pages[pageKey]; if(!page) return;
      if(pageKey==="settings" && currentAdmin?.role!=="super_admin") return;
      document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.page===pageKey));
      $("pageTitle").textContent=page.title;
      const root=$("pageContent");
      root.innerHTML="";
      if(pageKey==="dashboard"){
        root.innerHTML=`
          <section class="card span-4"><div class="stat-label">Acceso</div><div class="stat" style="font-size:20px">Activo</div><div class="stat-label">Cuenta validada en public.admins</div></section>
          <section class="card span-4"><div class="stat-label">Rol actual</div><div class="stat" style="font-size:20px">${currentAdmin.role==="superadmin"?"Superadmin":"Admin"}</div><div class="stat-label">${currentAdmin.role==="superadmin"?"Acceso a configuraciones críticas":"Gestión administrativa"}</div></section>
          <section class="card span-4"><div class="stat-label">Registro de actividad</div><div class="stat" style="font-size:20px">Habilitado</div><div class="stat-label">Las acciones deben registrarse en admin_activity_log</div></section>
          <section class="card span-12"><div class="section-head"><h3>Panel de gestión</h3></div><p class="muted">Elegí una sección desde el menú para consultar sus registros. Esta primera entrega implementa el acceso, la navegación y la lectura inicial; las operaciones de edición, aprobación y auditoría se incorporan módulo por módulo para respetar las reglas de seguridad.</p><div class="notice">No se ejecutan eliminaciones ni cambios de estado automáticamente. Las acciones sensibles requieren reglas explícitas y registro de actividad.</div></section>`;
        return;
      }
      if(pageKey==="settings"){
        root.innerHTML=`<section class="card span-12"><h3>Configuraciones críticas</h3><p class="muted">Sección visible únicamente para el rol superadmin.</p><div class="notice">Las operaciones críticas todavía no están habilitadas en esta entrega. No se muestran controles que aparenten modificar ajustes sin una implementación segura detrás.</div></section>`;
        return;
      }
      root.innerHTML=`<section class="card span-12"><div class="section-head"><div><h3>${page.title}</h3><p class="muted" style="margin:5px 0 0">${page.description}</p></div><button class="btn btn-quiet" id="refreshBtn">Actualizar</button></div><div id="dataStatus" class="muted" style="font-size:13px;margin-bottom:12px">Cargando registros…</div><div class="table-wrap"><table><thead id="dataHead"></thead><tbody id="dataBody"></tbody></table></div></section>`;
      $("refreshBtn").addEventListener("click",()=>loadTable(page));
      await loadTable(page);
    }
    async function loadTable(page){
      const status=$("dataStatus"),head=$("dataHead"),body=$("dataBody");
      if(!page.table)return;
      status.textContent="Consultando…"; head.innerHTML=""; body.innerHTML="";
      const {data,error}=await db.from(page.table).select("*").order("created_at",{ascending:false}).limit(50);
      if(error){status.textContent="No se pudieron cargar los registros. Revisá permisos RLS y columnas disponibles.";body.innerHTML=`<tr><td class="empty">${escapeHtml(error.message)}</td></tr>`;return;}
      if(!data?.length){status.textContent="0 registros encontrados (máximo 50 por consulta).";body.innerHTML='<tr><td class="empty">Todavía no hay registros para mostrar.</td></tr>';return;}
      const cols=Object.keys(data[0]).slice(0,6);
      head.innerHTML=`<tr>${cols.map(c=>`<th>${escapeHtml(c)}</th>`).join("")}</tr>`;
      body.innerHTML=data.map(row=>`<tr>${cols.map(c=>`<td>${escapeHtml(formatValue(row[c]))}</td>`).join("")}</tr>`).join("");
      status.textContent=`Mostrando ${data.length} registro(s). Vista de solo lectura.`;
    }
    function formatValue(value){
      if(value===null || value===undefined)return "—";
      if(typeof value==="object")return JSON.stringify(value);
      const s=String(value);return s.length>90?s.slice(0,87)+"…":s;
    }
    function escapeHtml(value){return String(value).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));}
    $("loginForm").addEventListener("submit",async(e)=>{
      e.preventDefault();
      if(!clientReady){showMessage("Falta configurar la publishable key de Supabase en el archivo.",true);return;}
      const btn=$("loginBtn");btn.disabled=true;btn.textContent="Ingresando…";
      const {data,error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
      btn.disabled=false;btn.textContent="Ingresar";
      if(error){showMessage("No se pudo iniciar sesión. Revisá el correo y la contraseña.",true);return;}
      await validateAdmin(data.session);
    });
    async function logout(){if(db) await db.auth.signOut();currentAdmin=null;showLogin();}
    $("logoutBtn").addEventListener("click",logout); $("mobileLogout").addEventListener("click",logout);
    $("navigation").addEventListener("click",e=>{const btn=e.target.closest("[data-page]");if(btn)renderPage(btn.dataset.page);});
    if(!clientReady){showMessage("Antes de usar el panel, pegá la publishable key del proyecto en SUPABASE_PUBLISHABLE_KEY.",true);}
    else{
      db.auth.getSession().then(({data})=>validateAdmin(data.session));
      db.auth.onAuthStateChange((_event,session)=>{if(session)validateAdmin(session);else showLogin();});
    }
  </script>
</body>
</html>
