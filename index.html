<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ilha da Magia — Auth Fase 3</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f5f7f8;color:#172026;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.card{width:min(440px,100%);background:#fff;border-radius:20px;padding:28px;box-shadow:0 10px 35px #0001}h1{margin:0 0 8px}p{color:#5d6870;line-height:1.45}.status{margin:16px 0;padding:12px;border-radius:10px;background:#f0f3f4;word-break:break-word}.error{color:#b42318}.ok{color:#087443}button,input{width:100%;padding:13px 14px;border-radius:10px;font:inherit}button{border:0;background:#172026;color:#fff;cursor:pointer;font-weight:700;margin-top:8px}input{border:1px solid #ccd3d7;margin:6px 0}label{display:block;font-size:13px;font-weight:700;margin-top:12px}.hidden{display:none}small{color:#69747b}
</style>
</head>
<body><main class="card">
<h1>Ilha da Magia</h1><p>Index técnico de Fase 3. Solamente autenticación y perfil.</p>
<section id="config"><label>Supabase URL</label><input id="url" value="https://omgtueqcfyznkibygfow.supabase.co" readonly><label>Publishable key</label><input id="key" type="password" placeholder="sb_publishable_... o anon key"><button id="save">Conectar Supabase</button><div id="configStatus" class="status">Falta conectar Supabase.</div></section>
<section id="login" class="hidden"><button id="google">Continuar con Google</button><div id="loginStatus" class="status">Sesión: no iniciada</div></section>
<section id="app" class="hidden"><div id="userStatus" class="status"></div><div id="missing" class="hidden"><h2>Crear perfil</h2><p>Elegí tu username único.</p><input id="username" maxlength="30" placeholder="tu_username" autocomplete="off"><button id="create">Crear perfil</button><div id="profileMsg"></div></div><div id="exists" class="hidden"><h2>Perfil</h2><div id="profile" class="status"></div></div><button id="logout">Cerrar sesión</button></section>
<small>Sin Inicio, Explorar, Eventos, Comunidad ni Admin.</small>
</main><script>
const $=id=>document.getElementById(id);let sb=null;const SUPABASE_URL='https://omgtueqcfyznkibygfow.supabase.co';
function setStatus(el,msg,cls='status'){el.textContent=msg;el.className='status '+cls}
function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function connect(){const key=$('key').value.trim();if(!key){setStatus($('configStatus'),'Pegá la publishable key (o anon key) de Supabase.','error');return}sb=window.supabase.createClient(SUPABASE_URL,key);localStorage.setItem('ilha_supabase_key',key);$('config').classList.add('hidden');$('login').classList.remove('hidden');await refresh()}
async function refresh(){if(!sb)return;const {data:{session},error}=await sb.auth.getSession();if(error){setStatus($('loginStatus'),error.message,'error');return}if(!session){$('login').classList.remove('hidden');$('app').classList.add('hidden');setStatus($('loginStatus'),'Sesión: no iniciada');return}$('login').classList.add('hidden');$('app').classList.remove('hidden');$('userStatus').textContent='Sesión activa: '+(session.user.email||session.user.id);const {data:p,error:e}=await sb.from('users').select('id,username,created_at').eq('id',session.user.id).maybeSingle();if(e){$('missing').classList.add('hidden');$('exists').classList.remove('hidden');$('profile').innerHTML='<span class="error">Error consultando public.users: '+esc(e.message)+'</span>';return}if(!p){$('missing').classList.remove('hidden');$('exists').classList.add('hidden')}else{$('missing').classList.add('hidden');$('exists').classList.remove('hidden');$('profile').innerHTML='<strong>Username:</strong> '+esc(p.username||'(sin username)')+'<br><strong>ID:</strong> '+esc(p.id)}}
$('save').onclick=connect;$('google').onclick=async()=>{if(!sb)return;setStatus($('loginStatus'),'Abriendo Google...');const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.origin+'/'}});if(error)setStatus($('loginStatus'),error.message,'error')};
$('create').onclick=async()=>{const u=$('username').value.trim();if(!/^[A-Za-z0-9_]{3,30}$/.test(u)){setStatus($('profileMsg'),'Usá entre 3 y 30 caracteres: letras, números o _.','error');return}const {data:{user}}=await sb.auth.getUser();if(!user)return;const {error}=await sb.from('users').insert({id:user.id,username:u});if(error){setStatus($('profileMsg'),error.code==='23505'?'Ese username ya está ocupado.':error.message,'error');return}setStatus($('profileMsg'),'Perfil creado correctamente.','ok');await refresh()};
$('logout').onclick=async()=>{await sb.auth.signOut();await refresh()};sb=window.supabase?null:null;const saved=localStorage.getItem('ilha_supabase_key');if(saved){$('key').value=saved;connect()}else{$('configStatus').textContent='Pegá la publishable key de Supabase una sola vez para conectar este Index.'}if(window.supabase){};
</script></body></html>
